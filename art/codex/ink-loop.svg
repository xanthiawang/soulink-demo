<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-labelledby="title desc">
  <title id="title">灵犀 · 看见，相遇，牵线，见面</title>
  <desc id="desc">十六秒手绘墨线循环。减弱动态时显示四幅静态小画。</desc>
  <style>
    :root{--ink:rgba(0,0,0,.85)}
    .ink{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;filter:url(#boil)}
    .scene{opacity:0;animation:scene 16s linear infinite;animation-delay:var(--phase)}
    .s0{--phase:0s}.s1{--phase:-12s}.s2{--phase:-8s}.s3{--phase:-4s}
    .draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 16s linear infinite;animation-delay:var(--phase)}
    .detail{animation-name:detail}.thread{animation-name:thread}
    .fine{stroke-width:1.4}
    .solid{fill:var(--ink);stroke:none;opacity:0;animation:solid 16s linear infinite;animation-delay:var(--phase)}
    .arrival{animation-name:arrival}
    .blink{transform-origin:150px 148px;animation:blink 16s linear infinite}
    .satellite{offset-path:path('M 52 188 C 38 166 102 130 167 121 C 226 112 260 122 245 145 C 226 174 157 200 99 204 C 71 207 55 199 52 188 Z');offset-anchor:center;offset-rotate:0deg;animation:orbit 16s linear infinite;animation-delay:var(--phase)}
    .vapor{animation:rise 16s ease-in-out infinite;animation-delay:var(--phase)}
    .vapor.b{animation-name:riseB}.vapor.c{animation-name:riseC}
    .twinkle{animation:twinkle 2.4s ease-in-out infinite}.twinkle.b{animation-delay:-.8s}.twinkle.c{animation-delay:-1.6s}
    @keyframes scene{0%{opacity:0}1.25%,20.6%{opacity:1}24.9%,100%{opacity:0}}
    @keyframes draw{0%,.6%{stroke-dashoffset:1}7.8%,20.6%{stroke-dashoffset:0}24.9%,100%{stroke-dashoffset:-1}}
    @keyframes detail{0%,3.1%{stroke-dashoffset:1}10.3%,20.6%{stroke-dashoffset:0}24.9%,100%{stroke-dashoffset:-1}}
    @keyframes thread{0%,2.5%{stroke-dashoffset:1}11.8%,21%{stroke-dashoffset:0}24.9%,100%{stroke-dashoffset:-1}}
    @keyframes solid{0%,6%{opacity:0}8.5%,21%{opacity:1}24.9%,100%{opacity:0}}
    @keyframes arrival{0%,11.5%{opacity:0}12%,21%{opacity:1}24.9%,100%{opacity:0}}
    @keyframes blink{0%,13.5%,15.25%,17.35%,19%,100%{transform:scaleY(1)}14.35%,18.1%{transform:scaleY(.045)}}
    @keyframes orbit{0%{offset-distance:4%}25%{offset-distance:96%}100%{offset-distance:96%}}
    @keyframes rise{0%,5%{transform:translate(0,5px)}21%,100%{transform:translate(-3px,-9px)}}
    @keyframes riseB{0%,5%{transform:translate(0,3px)}21%,100%{transform:translate(2px,-13px)}}
    @keyframes riseC{0%,5%{transform:translate(0,6px)}21%,100%{transform:translate(-1px,-8px)}}
    @keyframes twinkle{0%,100%{opacity:.16}47%{opacity:.85}68%{opacity:.4}}
    @media(prefers-reduced-motion:reduce){
      *{animation:none!important}
      .ink{filter:none}
      .draw{stroke-dasharray:none;stroke-dashoffset:0}
      .scene,.solid,.twinkle{opacity:1}
      .blink,.vapor{transform:none}
      .satellite{offset-distance:47%}
      .s0{transform:translate(0px,0px) scale(.5)}
      .s1{transform:translate(150px,0px) scale(.5)}
      .s2{transform:translate(0px,150px) scale(.5)}
      .s3{transform:translate(150px,150px) scale(.5)}
    }
  </style>
  <defs>
    <filter id="boil" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".035" numOctaves="2" seed="3" result="grain">
        <animate attributeName="seed" values="3;8;2;11;5;14;6;9" dur="1.2s" calcMode="discrete" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="grain" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g class="ink">
    <!-- 00–04 s / 看见：不对称眼廓、放射睫毛、两次眨眼。 -->
    <g class="scene s0" id="see">
      <g class="blink">
        <path class="draw" pathLength="1" d="M 74 148 C 92 125 117 113 144 114 C 177 111 204 127 225 145 C 209 163 181 180 153 179 C 119 182 93 167 74 148 L 70 146"/>
        <path class="draw fine detail" pathLength="1" d="M 84 139 C 107 117 125 111 148 112 M 159 181 C 184 177 202 166 214 156"/>
        <path class="draw" pathLength="1" d="M 156 116 C 174 120 181 132 179 149 C 179 167 166 177 150 176 C 132 177 120 164 121 147 C 119 130 134 115 149 117 C 152 116 155 116 159 118"/>
        <path class="draw fine detail" pathLength="1" d="M 151 123 C 136 122 128 134 129 147 C 127 159 139 170 150 169 M 158 126 C 170 131 174 145 167 158 M 134 132 L 138 136 M 128 145 L 134 146 M 134 158 L 139 154 M 145 168 L 147 162 M 161 165 L 158 160 M 173 147 L 166 147"/>
        <path class="solid" fill-rule="evenodd" pathLength="1" d="M 150 134 C 159 133 164 140 163 148 C 164 158 156 163 149 160 C 141 159 138 152 139 145 C 140 138 144 134 150 134 Z M 147 138 C 144 138 143 142 145 144 C 147 146 151 143 150 140 C 150 139 148 138 147 138 Z"/>
      </g>
      <path class="draw detail" pathLength="1" d="M 79 128 Q 73 119 69 111 M 91 117 Q 85 105 79 97 M 103 110 Q 100 100 96 93 M 116 104 Q 111 88 106 77 M 130 99 Q 130 85 126 69 M 143 98 Q 141 86 143 80 M 156 99 Q 159 83 158 70 M 170 102 Q 175 89 179 77 M 184 108 Q 191 94 196 87 M 197 116 Q 206 106 208 100 M 211 127 Q 219 117 225 113"/>
      <path class="draw fine detail" pathLength="1" d="M 89 128 L 85 121 M 111 99 L 108 93 M 137 90 L 136 82 M 168 89 L 170 83 M 189 118 L 194 111 M 218 135 L 225 130"/>
      <path class="draw detail" pathLength="1" d="M 84 169 Q 77 176 73 184 M 97 179 L 87 194 M 110 186 Q 106 197 101 204 M 126 191 Q 122 209 119 216 M 140 195 L 139 207 M 154 196 Q 157 210 156 225 M 169 191 Q 174 204 179 212 M 184 186 L 195 202 M 199 178 Q 209 187 211 192 M 213 168 L 227 179"/>
      <path class="draw fine detail" pathLength="1" d="M 109 201 L 105 211 M 149 207 L 149 215 M 188 199 L 191 207 M 91 184 L 88 189"/>
      <g class="twinkle b"><path class="draw fine" pathLength="1" d="M 224 77 Q 225 84 232 86 Q 225 87 223 94 Q 222 88 216 86 Q 222 84 224 77 Z"/></g>
      <g class="twinkle"><path class="draw" pathLength="1" d="M 67 204 L 67.4 204.5 M 207 218 L 207.5 217.8"/></g>
    </g>
    <!-- 04–08 s / 相遇：一个微小的人，和同一条轨道上的另一颗星球。 -->
    <g class="scene s1" id="meet">
      <path class="draw fine" pathLength="1" d="M 52 188 C 38 166 102 130 167 121 C 226 112 260 122 245 145 C 226 174 157 200 99 204 C 71 207 55 199 52 188 Z"/>
      <path class="draw" pathLength="1" d="M 132 111 C 105 112 86 133 86 157 C 82 181 100 205 124 210 C 149 216 175 201 182 177 C 193 149 180 123 157 114 C 149 111 140 110 132 111 L 127 112"/>
      <path class="draw fine detail" pathLength="1" d="M 90 150 C 90 132 108 117 121 116 M 137 207 C 154 205 169 194 176 182"/>
      <path class="draw fine detail" pathLength="1" d="M 98 149 Q 107 138 117 141 Q 125 143 120 149 Q 112 155 103 151 M 150 187 Q 159 179 165 184 Q 171 190 159 194 Q 152 195 150 191 M 117 186 Q 123 182 128 186 M 153 130 Q 158 127 162 132"/>
      <path class="draw detail" pathLength="1" d="M 104 169 L 104.5 169.4 M 111 176 L 111.2 176.3 M 131 197 L 131.5 197 M 166 149 L 166.4 149.2 M 174 157 L 174.2 157.4 M 123 130 L 123.2 130.1"/>
      <g class="solid">
        <path pathLength="1" d="M 132 84 C 135 83 138 86 137 89 C 137 92 134 94 132 92 C 129 91 129 86 132 84 Z"/>
        <path pathLength="1" d="M 131 94 Q 134 93 137 95 L 139 104 L 136 104 L 137 111 L 134 112 L 133 103 L 131 111 L 128 111 L 130 101 L 127 105 L 125 104 L 129 97 Z"/>
      </g>
      <path class="draw fine detail" pathLength="1" d="M 136 96 Q 142 97 144 93 M 124 113 Q 135 110 144 113"/>
      <g class="satellite">
        <path class="draw" pathLength="1" d="M -3 -12 C 5 -14 12 -8 12 -1 C 14 7 6 13 -1 12 C -9 13 -14 6 -12 -2 C -13 -8 -8 -12 -3 -12 Z"/>
        <path class="draw fine detail" pathLength="1" d="M -7 -4 Q -4 -8 0 -6 M 3 5 Q 6 3 7 6"/>
      </g>
      <g class="twinkle"><path class="draw fine detail" pathLength="1" d="M 208 80 Q 210 89 217 91 Q 209 93 207 101 Q 206 93 199 91 Q 206 88 208 80 Z"/></g>
      <g class="twinkle c"><path class="draw fine detail" pathLength="1" d="M 67 127 Q 68 132 73 134 Q 68 135 66 141 Q 65 136 61 134 Q 66 132 67 127 Z M 207 214 L 207.3 214.2 M 190 225 L 190.3 225.2"/></g>
    </g>
    <!-- 08–12 s / 牵线：折起的信纸，线从左上生长，穿过信纸后连到右下。 -->
    <g class="scene s2" id="connect">
      <path class="draw" pathLength="1" d="M 99 117 Q 145 113 182 109 L 209 135 Q 210 163 215 188 Q 164 191 107 198 Q 104 162 99 117 L 98 112"/>
      <path class="draw" pathLength="1" d="M 182 109 Q 185 122 184 136 Q 197 136 209 135"/>
      <path class="draw fine detail" pathLength="1" d="M 110 194 Q 147 192 167 189 M 102 125 L 105 153"/>
      <path class="draw detail" pathLength="1" d="M 118 134 Q 137 130 157 130 M 120 145 Q 144 142 169 142 M 125 178 Q 136 176 146 177"/>
      <path class="draw fine detail" pathLength="1" d="M 174 171 Q 173 161 180 160 Q 186 161 180 170 L 174 179 Q 169 183 168 178 Q 170 173 184 175"/>
      <path class="solid" pathLength="1" d="M 62 87 C 67 85 70 89 69 93 C 69 98 62 99 59 95 C 56 91 58 87 62 87 Z"/>
      <path class="draw thread" pathLength="1" d="M 63 92 C 76 69 110 72 110 91 C 110 107 83 114 78 133 C 69 164 102 178 119 163 C 132 151 125 141 117 150 C 104 166 151 173 171 155 C 194 134 230 145 225 166 C 220 186 191 186 192 207 C 192 222 214 231 235 216"/>
      <path class="solid arrival" pathLength="1" d="M 236 211 C 241 212 242 218 238 221 C 234 224 229 221 230 217 C 229 212 233 210 236 211 Z"/>
      <g class="twinkle b"><path class="draw fine detail" pathLength="1" d="M 216 84 Q 218 91 224 92 Q 217 94 216 101 Q 214 95 208 93 Q 214 92 216 84 Z"/></g>
      <g class="twinkle"><path class="draw detail" pathLength="1" d="M 65 188 L 65.5 188.2 M 78 214 L 78.3 214.4 M 150 79 L 150.3 79.3"/></g>
      <path class="draw fine detail" pathLength="1" d="M 54 82 L 51 78 M 67 78 L 68 72 M 244 210 L 250 208 M 239 228 L 240 233"/>
    </g>
    <!-- 12–16 s / 见面：略歪的杯沿、复描的碟、三缕独立热气。 -->
    <g class="scene s3" id="coffee">
      <path class="draw" pathLength="1" d="M 88 151 C 104 140 155 139 178 146 C 199 153 178 163 149 165 C 119 168 92 164 88 156 Q 86 153 88 151 Z"/>
      <path class="draw" pathLength="1" d="M 88 154 Q 89 182 99 201 C 109 217 159 219 176 202 Q 187 181 185 154"/>
      <path class="draw fine detail" pathLength="1" d="M 95 157 Q 112 163 135 161 M 95 175 Q 97 194 106 201 M 113 210 Q 137 217 158 209"/>
      <path class="draw" pathLength="1" d="M 187 163 C 213 153 227 168 215 185 Q 208 197 181 194 M 190 170 Q 209 163 209 175 Q 209 186 185 187"/>
      <path class="draw" pathLength="1" d="M 94 207 C 73 212 66 221 84 227 C 112 238 181 235 200 225 C 214 218 203 211 184 208"/>
      <path class="draw fine detail" pathLength="1" d="M 85 229 Q 121 241 168 235 M 101 222 Q 139 229 177 221"/>
      <g class="vapor"><path class="draw detail" pathLength="1" d="M 114 136 C 125 124 102 114 110 101 Q 113 95 119 91"/></g>
      <g class="vapor b"><path class="draw detail" pathLength="1" d="M 139 135 C 148 122 126 112 138 99 C 151 85 132 77 142 67"/></g>
      <g class="vapor c"><path class="draw detail" pathLength="1" d="M 163 134 C 171 124 154 116 163 105 Q 168 99 167 93"/></g>
      <path class="draw" pathLength="1" d="M 210 64 C 192 64 182 82 191 95 C 200 108 216 107 225 95 C 212 99 201 89 202 78 Q 203 70 210 64 Z"/>
      <path class="draw fine detail" pathLength="1" d="M 189 77 Q 185 89 194 97"/>
      <g class="twinkle b"><path class="draw fine detail" pathLength="1" d="M 77 91 Q 78 100 86 102 Q 78 104 76 112 Q 75 105 68 103 Q 74 101 77 91 Z"/></g>
      <g class="twinkle"><path class="draw fine detail" pathLength="1" d="M 232 116 Q 232 122 237 123 Q 232 125 231 129 Q 230 125 226 124 Q 230 122 232 116 Z M 172 68 L 172.3 68.3 M 62 160 L 62.4 160.4 M 224 202 L 224.4 202.2"/></g>
    </g>
    <!-- 常驻极少量碎墨；小短线代替标准圆。 -->
    <g class="dust fine">
      <path class="twinkle" pathLength="1" d="M 49 116 L 49.3 116.3 M 243 173 L 243.5 173.2 M 181 247 L 181.3 247.3"/>
      <path class="twinkle b" pathLength="1" d="M 93 59 L 93.3 59.5 M 251 99 L 251.2 99.4 M 57 226 L 57.3 225.8"/>
      <path class="twinkle c" pathLength="1" d="M 176 47 L 176.5 47.1 M 111 245 L 111.3 245.4"/>
    </g>
  </g>
</svg>
